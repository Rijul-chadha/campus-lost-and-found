name: campus-lost

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://campus:campus@postgres:5432/campus_lost
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://s3:9090
    S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_lost
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_lost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible store for photos in local dev (S3Mock). Production points the
  # S3_* settings at real S3 or Cloudflare R2; no code changes.
  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: campus-lost-photos
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    ports: ["9000:9090"]
    volumes: [s3data:/data]

  # Local SMTP sink: open http://localhost:8025 to read login codes and notifications.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  migrate:
    build: ./backend
    <<: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    <<: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    <<: *backend-env
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  s3data:
