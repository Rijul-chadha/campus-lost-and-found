[project]
name = "campus-lost"
version = "0.1.0"
description = "Campus lost-and-found platform: finder reports, AI-assisted search, standing watches, desk custody tracking."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3.2",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "boto3>=1.35",
  "pillow>=10.4",
  "numpy>=1.26",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "aiosmtplib>=3.0",
  "email-validator>=2.2",
]

[project.optional-dependencies]
# Real semantic embeddings. Optional so the base image stays small; hashing embedder works without it.
ml = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Postgres + Redis (run via docker compose or CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002"]  # asserts; Depends() defaults; typographic quotes in copy

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
